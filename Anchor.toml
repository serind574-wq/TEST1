# ---------------------------------------------------------------------------------------------
# Jupiter Lend (mainnet) accounts, for `anchor test` against a mainnet-forked validator.
#
# NOTE: Jupiter Lend's flashloan program is a mainnet deployment. To exercise the full pipeline on
# a local validator you must clone the program *and* the accounts it reads. The list below is the
# minimum set; the reserve / borrow-position / rate-model accounts additionally required by
# `flashloan_borrow` are liquidity-layer PDAs whose seeds are not part of the published IDL, so
# discover them from a live mainnet transaction before relying on this section.
# ---------------------------------------------------------------------------------------------
[test.validator]
url = "https://api.mainnet-beta.solana.com"

[[test.validator.clone]]
address = "jupgfSgfuAXv4B6R2Uxu85Z1qdzgju79s6MfZekN6XS" # flashloan program

[[test.validator.clone]]
address = "ALXWtv2P4GqH1B7Lq731joag52yRBRqmHV4naiXPTYWL" # flashloan admin PDA (["flashloan_admin"])

[[test.validator.clone]]
address = "jupeiUmn818Jg1ekPURTpr4mFo29p46vygyykFJ3wZC" # liquidity program

[[test.validator.clone]]
address = "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v" # USDC mint

